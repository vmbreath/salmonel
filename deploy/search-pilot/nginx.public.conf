worker_processes 1;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 limit_req_zone $binary_remote_addr zone=search:2m rate=3r/s;
 limit_conn_zone $binary_remote_addr zone=clients:1m;
 limit_req_status 429;
 limit_conn_status 429;
 client_max_body_size 1k;
 client_header_timeout 10s;
 client_body_timeout 10s;
 send_timeout 15s;
 keepalive_timeout 15s;
 server { listen 80; server_name 168.113.169.29;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 308 https://168.113.169.29$request_uri; }
 }
 server {
  listen 443 ssl;
  server_name 168.113.169.29;
  ssl_certificate /etc/letsencrypt/live/168.113.169.29/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/168.113.169.29/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  limit_conn clients 12;
  if ($request_method !~ ^(GET|HEAD)$) { return 403; }
  location ~ ^/(test|filter|healthz)$ {
   limit_req zone=search burst=15 nodelay;
   proxy_pass http://app:3000;
   proxy_connect_timeout 3s;
   proxy_read_timeout 8s;
   proxy_hide_header X-Powered-By;
  }
  location ~ ^/(static/(js|css|media)/[a-zA-Z0-9_.-]+|index\.html|favicon\.ico|logo192\.png|logo512\.png|manifest\.json|robots\.txt|asset-manifest\.json)?$ {
   proxy_pass http://app:3000;
   proxy_read_timeout 8s;
  }
  location / { return 403; }
 }
}
