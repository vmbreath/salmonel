services:
  proxy:
    image: nginx:stable-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "168.113.169.29:80:80/tcp"
      - "168.113.169.29:443:443/tcp"
    volumes:
      - ./nginx.active.conf:/etc/nginx/nginx.conf:ro
      - ./acme-webroot:/var/www/acme:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs: ["/var/cache/nginx:size=16m", "/var/run:size=1m", "/tmp:size=4m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 40
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
